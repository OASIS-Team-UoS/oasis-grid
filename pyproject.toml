[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oasis-grid"
version = "0.1.0"
description = "Interactive OASIS icosahedral and cube-sphere grid explorer with MPI-domain postprocessing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
  "cube-sphere",
  "geodesic-grid",
  "icosahedral-grid",
  "mpi-decomposition",
  "oasis",
  "spherical-grid",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/jmmendonca/oasis-grid"
Repository = "https://github.com/jmmendonca/oasis-grid"
Mirror = "https://github.com/OASIS-Team-UoS/oasis-grid"
Issues = "https://github.com/jmmendonca/oasis-grid/issues"

[project.scripts]
oasis-grid = "oasis_grid:main"

[tool.hatch.build.targets.wheel]
py-modules = ["oasis_grid"]
